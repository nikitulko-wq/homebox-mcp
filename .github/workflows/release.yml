name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="homebox-mcp"
          [ "$GOOS" = "windows" ] && BIN="homebox-mcp.exe"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$BIN" .
          cp README.md LICENSE dist/
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q -r "../homebox-mcp_${VERSION}_${GOOS}_${GOARCH}.zip" .)
          else
            tar -czf "homebox-mcp_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C dist .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: homebox-mcp_*
          generate_release_notes: true
